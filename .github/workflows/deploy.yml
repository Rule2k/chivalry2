name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/chivalry2
            git pull origin main
            docker build -t chivalry2 .
            docker stop chivalry2 || true
            docker rm chivalry2 || true
            docker run -d --name chivalry2 -p 3000:3000 --restart unless-stopped chivalry2

